name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore packages
        run: dotnet restore PacmanMobile.csproj

      - name: Build installable APK
        run: dotnet publish PacmanMobile.csproj -f net8.0-android -c Release -p:AndroidPackageFormats=apk --no-restore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PacmanMobile-APK
          path: bin/Release/net8.0-android/publish/*.apk
          if-no-files-found: error
          retention-days: 7
